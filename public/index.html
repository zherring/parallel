<style>
:root {
  --bg: #0b0a09;
  --text: #f2ede3;
  --muted: #aaa296;
  --accent: #f0b24a;
  --accent-soft: rgba(240, 178, 74, 0.14);
  --accent-line: rgba(240, 178, 74, 0.38);
  --rule: #26221c;
  --poster-top: #27231c;
  --poster-bottom: #17140f;
  --poster-edge: #36312a;
  --gutter: clamp(1rem, 5vw, 3rem);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(70rem 30rem at 12% -8%, rgba(240, 178, 74, 0.11), transparent 70%),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.6;
  overflow-x: hidden;
}

.wrap {
  width: 100%;
  max-width: 72rem;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

/* Hero */
.hero {
  padding-top: clamp(3rem, 10vw, 7.5rem);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  margin: 0 0 clamp(1.25rem, 3vw, 2rem);
  padding: 0.4rem 0.95rem 0.4rem 0.8rem;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1.2;
}

.chip::before {
  content: "";
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 0 var(--accent-line);
  animation: ping 2.4s ease-out infinite;
}

h1 {
  margin: 0;
  font-size: clamp(3.25rem, 1.2rem + 10.5vw, 9rem);
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: -0.045em;
}

h1 .ll { color: var(--accent); }

.tagline {
  margin: clamp(1rem, 2.5vw, 1.75rem) 0 0;
  max-width: 24ch;
  font-size: clamp(1.375rem, 0.9rem + 2.4vw, 2.25rem);
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

/* Body copy */
.lede {
  margin: clamp(1.25rem, 3vw, 2rem) 0 0;
  max-width: 34rem;
  color: var(--muted);
  font-size: clamp(1rem, 0.92rem + 0.4vw, 1.1875rem);
}

/* Decorative graphic */
main { flex: 1 0 auto; }

.graphic {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  margin-top: clamp(2.5rem, 7vw, 5rem);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent);
  mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent);
}

.lanes {
  flex: 0 0 auto;
  display: block;
  width: max(100%, 560px);
  height: auto;
}

.axis { stroke: var(--rule); stroke-width: 1; }

.poster { fill: url(#poster); stroke: var(--poster-edge); stroke-width: 1; }
.poster-bar { fill: #3a342b; }

.hot { fill: url(#hot); stroke: var(--accent); stroke-width: 1.25; }
.hot-bar { fill: var(--accent); opacity: 0.55; }

.glow {
  fill: var(--accent);
  filter: url(#blur);
  opacity: 0.55;
  animation: pulse 3.6s ease-in-out infinite;
  animation-delay: calc(var(--i) * 0.7s);
}

.link {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 0;
  animation: draw 1.1s cubic-bezier(0.3, 0, 0.2, 1) both;
  animation-delay: calc(0.5s + var(--i) * 0.3s);
}

.node {
  fill: var(--accent);
  animation: appear 0.5s ease-out both;
  animation-delay: calc(0.5s + var(--i) * 0.3s);
}

/* Footer */
footer {
  margin-top: clamp(3rem, 8vw, 6rem);
  border-top: 1px solid var(--rule);
  padding-block: 1.75rem 2rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.75rem 2rem;
}

footer p { margin: 0; }

footer .tmdb { max-width: 34rem; }

a {
  color: var(--accent);
  text-underline-offset: 0.2em;
  text-decoration-thickness: 1px;
}

a:hover { text-decoration-thickness: 2px; }

a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 2px;
}

/* Motion */
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes ping {
  0% { box-shadow: 0 0 0 0 var(--accent-line); }
  70%, 100% { box-shadow: 0 0 0 0.55rem rgba(240, 178, 74, 0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
